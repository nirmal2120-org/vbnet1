name: Polaris VB Scan - PIFSS Demo

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  polaris:
    runs-on: windows-latest

    steps:
      # --------------------------------------------------
      # Checkout source code
      # --------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------
      # List files and auto-detect the solution / project
      # --------------------------------------------------
      - name: Find solution file
        shell: pwsh
        run: |
          Write-Host "=== Solution / project files in repo ==="
          Get-ChildItem -Recurse -Include *.sln,*.vbproj | ForEach-Object { Resolve-Path -Relative $_.FullName }

          $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
          if (-not $sln) {
            $sln = Get-ChildItem -Recurse -Filter *.vbproj | Select-Object -First 1
          }
          if (-not $sln) { Write-Error "No .sln or .vbproj found"; exit 1 }

          $rel = (Resolve-Path -Relative $sln.FullName).TrimStart('.','\')
          Write-Host "Using: $rel"
          "SLN_PATH=$rel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # --------------------------------------------------
      # Setup MSBuild and NuGet
      # --------------------------------------------------
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      # --------------------------------------------------
      # Setup Java 17 (required for SCA)
      # --------------------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # Restore NuGet packages (skipped safely if none)
      # --------------------------------------------------
      - name: Restore packages
        shell: pwsh
        continue-on-error: true
        run: nuget restore "$env:SLN_PATH"

      # --------------------------------------------------
      # Verify the build works before scanning
      # --------------------------------------------------
      - name: Verify build
        shell: pwsh
        run: msbuild "$env:SLN_PATH" -t:Rebuild -p:Configuration=Release

      # --------------------------------------------------
      # Download Black Duck Bridge CLI (Windows)
      # --------------------------------------------------
      - name: Download Bridge CLI
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://repo.blackduck.com/bds-integrations-release/com/blackduck/integration/bridge/binaries/bridge-cli-bundle/latest/bridge-cli-bundle-win64.zip" -OutFile bridge.zip
          Expand-Archive bridge.zip -DestinationPath . -Force
          .\bridge-cli-bundle-win64\bridge-cli.exe --version

      # --------------------------------------------------
      # Run Polaris SAST (build capture) + SCA
      # --------------------------------------------------
      - name: Polaris SAST + SCA
        shell: pwsh
        env:
          POLARIS_SERVER_URL: ${{ vars.POLARIS_SERVER_URL }}
          POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
        run: |
          .\bridge-cli-bundle-win64\bridge-cli.exe --stage polaris `
            polaris.serverUrl=$env:POLARIS_SERVER_URL `
            polaris.accessToken=$env:POLARIS_ACCESS_TOKEN `
            polaris.application.name=PIFSS-Demo `
            polaris.project.name=pifss-vb-demo `
            polaris.branch.name=${{ github.ref_name }} `
            polaris.assessment.types=SAST,SCA `
            polaris.test.sca.type=SCA-PACKAGE,SCA-SIGNATURE `
            "coverity.clean.command=msbuild `"$env:SLN_PATH`" -t:Clean" `
            "coverity.build.command=msbuild `"$env:SLN_PATH`" -t:Rebuild -p:Configuration=Release" `
            "detect.args=--detect.detector.search.depth=3"

      # --------------------------------------------------
      # Upload Bridge logs if the scan fails
      # --------------------------------------------------
      - name: Upload Bridge logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-logs
          path: .bridge/      # Run Polaris SAST (build capture) + SCA
      # --------------------------------------------------
      - name: Polaris SAST + SCA
        shell: pwsh
        env:
          POLARIS_SERVER_URL: ${{ vars.POLARIS_SERVER_URL }}
          POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
        run: |
          .\bridge-cli-bundle-win64\bridge-cli.exe --stage polaris `
            polaris.serverUrl=$env:POLARIS_SERVER_URL `
            polaris.accessToken=$env:POLARIS_ACCESS_TOKEN `
            polaris.application.name=PIFSS-Demo `
            polaris.project.name=pifss-vb-demo `
            polaris.branch.name=${{ github.ref_name }} `
            polaris.assessment.types=SAST,SCA `
            polaris.test.sca.type=SCA-PACKAGE,SCA-SIGNATURE `
            "coverity.clean.command=msbuild `"$env:SLN_PATH`" -t:Clean" `
            "coverity.build.command=msbuild `"$env:SLN_PATH`" -t:Rebuild -p:Configuration=Release" `
            "detect.args=--detect.detector.search.depth=3"

      # --------------------------------------------------
      # Upload Bridge logs if the scan fails
      # --------------------------------------------------
      - name: Upload Bridge logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bridge-logs
          path: .bridge/
